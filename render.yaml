services:
  - type: web
    name: ags-friend-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REGION
        value: IND
      - key: PORT
        value: 10000
    autoDeploy: true
    healthCheckPath: /healthz